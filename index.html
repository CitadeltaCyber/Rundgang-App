<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1418">
<title>Rundgang</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0f1418;
    --card: #1a2229;
    --card-done: #16301f;
    --line: #2b3640;
    --text: #e8edf2;
    --muted: #8b9aa8;
    --accent: #35c46a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    -webkit-text-size-adjust: 100%;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }

  h1 { font-size: 22px; margin: 0; }

  #datum { color: var(--muted); font-size: 14px; }

  #fortschritt {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 16px;
  }

  /* --- Kontrollpunkte --- */
  ul { list-style: none; margin: 0; padding: 0; }

  li { margin-bottom: 10px; }

  label {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 14px;
    cursor: pointer;
    /* Große Fläche = mit Handschuhen bedienbar */
    min-height: 64px;
    -webkit-tap-highlight-color: transparent;
  }

  input[type="checkbox"] {
    width: 26px;
    height: 26px;
    flex: 0 0 auto;
    accent-color: var(--accent);
    margin: 0;
  }

  .punkt { display: flex; flex-direction: column; gap: 2px; }

  .name { line-height: 1.3; }

  .zeit { font-size: 13px; color: var(--muted); }

  label:has(input:checked) {
    background: var(--card-done);
    border-color: var(--accent);
  }

  label:has(input:checked) .name {
    color: var(--muted);
    text-decoration: line-through;
  }

  /* --- Vorkommnisse --- */
  h2 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 28px 0 8px;
  }

  textarea {
    width: 100%;
    min-height: 140px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font: inherit;
    padding: 14px;
    resize: vertical;
  }

  textarea:focus, input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 18px;
  }

  #status { color: var(--muted); font-size: 13px; }

  button {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 16px;
    font: inherit;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Rundgang</h1>
  <span id="datum"></span>
</header>
<p id="fortschritt"></p>

<ul id="liste"></ul>

<h2>Besondere Vorkommnisse</h2>
<textarea id="vorkommnisse" placeholder="Keine besonderen Vorkommnisse."></textarea>

<footer>
  <span id="status">Automatisch gespeichert</span>
  <button id="neu" type="button">Neuer Rundgang</button>
</footer>

<script>
// Die 5 Kontrollpunkte. Zum Ändern einfach die Texte hier anpassen.
const KONTROLLPUNKTE = [
  "Haupteingang",
  "Tiefgarage",
  "Lager / Warenannahme",
  "Bürotrakt 1. OG",
  "Notausgang Hinterhof"
];

const SPEICHER = "rundgang.v1";
const liste = document.getElementById("liste");
const feldVorkommnisse = document.getElementById("vorkommnisse");
const fortschritt = document.getElementById("fortschritt");

// Gespeicherten Stand laden – sonst leerer Rundgang.
let daten = laden();

function laden() {
  try {
    const roh = localStorage.getItem(SPEICHER);
    if (roh) return JSON.parse(roh);
  } catch (e) {
    // Kaputte Daten ignorieren und frisch anfangen.
  }
  return leererRundgang();
}

function leererRundgang() {
  return {
    begonnen: new Date().toISOString(),
    punkte: KONTROLLPUNKTE.map(name => ({ name, erledigt: false, zeit: null })),
    vorkommnisse: ""
  };
}

function speichern() {
  localStorage.setItem(SPEICHER, JSON.stringify(daten));
}

function uhrzeit(iso) {
  return new Date(iso).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
}

function zeichnen() {
  document.getElementById("datum").textContent =
    new Date(daten.begonnen).toLocaleDateString("de-DE", {
      day: "2-digit", month: "2-digit", year: "numeric"
    });

  liste.replaceChildren();

  daten.punkte.forEach((punkt, i) => {
    const li = document.createElement("li");
    const label = document.createElement("label");

    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = punkt.erledigt;
    box.addEventListener("change", () => abhaken(i, box.checked));

    const spalte = document.createElement("div");
    spalte.className = "punkt";

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = (i + 1) + ". " + punkt.name;

    const zeit = document.createElement("span");
    zeit.className = "zeit";
    zeit.textContent = punkt.zeit ? "kontrolliert um " + uhrzeit(punkt.zeit) + " Uhr" : "";

    spalte.append(name, zeit);
    label.append(box, spalte);
    li.append(label);
    liste.append(li);
  });

  const erledigt = daten.punkte.filter(p => p.erledigt).length;
  fortschritt.textContent = erledigt + " von " + daten.punkte.length + " Kontrollpunkten erledigt";
}

function abhaken(i, erledigt) {
  daten.punkte[i].erledigt = erledigt;
  // Uhrzeit festhalten – ein Haken ohne Zeitstempel ist als Nachweis wertlos.
  daten.punkte[i].zeit = erledigt ? new Date().toISOString() : null;
  speichern();
  zeichnen();
}

feldVorkommnisse.addEventListener("input", () => {
  daten.vorkommnisse = feldVorkommnisse.value;
  speichern();
});

document.getElementById("neu").addEventListener("click", () => {
  if (!confirm("Neuen Rundgang starten? Der aktuelle Stand wird gelöscht.")) return;
  daten = leererRundgang();
  feldVorkommnisse.value = "";
  speichern();
  zeichnen();
});

feldVorkommnisse.value = daten.vorkommnisse || "";
zeichnen();

// Service Worker: macht die App offline nutzbar (Tiefgarage, Keller, kein Netz).
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
