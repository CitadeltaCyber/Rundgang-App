<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1418">
<title>Rundgang</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Rundgang</h1>
  <span id="datum"></span>
</header>
<p id="fortschritt"></p>

<div id="nfcLeiste">
  <button id="nfcScan" type="button" aria-pressed="false">NFC-Scan starten</button>
  <button id="bearbeiten" type="button" aria-pressed="false">Bearbeiten</button>
</div>

<p id="meldung" role="status"></p>

<ul id="liste"></ul>

<button id="punktHinzu" class="klein" type="button" hidden>+ Kontrollpunkt hinzufügen</button>

<h2>Besondere Vorkommnisse</h2>
<textarea id="vorkommnisse" placeholder="Keine besonderen Vorkommnisse."></textarea>

<footer>
  <span id="status">Automatisch gespeichert</span>
  <button id="neu" type="button">Neuer Rundgang</button>
</footer>

<script src="app.js"></script>
</body>
</html>
